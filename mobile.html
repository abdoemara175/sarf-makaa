<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معاينة تطبيق الجوال | شركة خدمات الصرف الصحي بمكة المكرمة</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 1.5rem 1rem;
            overflow-x: hidden;
        }

        /* Top Toolbar Controls */
        .toolbar {
            width: 100%;
            max-width: 900px;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 0.9rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .toolbar-title {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.1rem;
            font-weight: 800;
            color: #2dd4bf;
        }

        .toolbar-title i {
            font-size: 1.4rem;
        }

        .controls-group {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        .btn-ctrl {
            background: rgba(255, 255, 255, 0.08);
            color: #cbd5e1;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 0.5rem 1rem;
            border-radius: 30px;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-ctrl:hover, .btn-ctrl.active {
            background: #2dd4bf;
            color: #0f172a;
            border-color: #2dd4bf;
            box-shadow: 0 0 15px rgba(45, 212, 191, 0.4);
        }

        .badge-live {
            background: rgba(37, 211, 102, 0.15);
            color: #25D366;
            border: 1px solid rgba(37, 211, 102, 0.3);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #25D366;
            border-radius: 50%;
            animation: pulseDot 1.5s infinite;
        }

        @keyframes pulseDot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
        }

        /* Phone Device Mockup Container */
        .device-wrapper {
            position: relative;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .smartphone-frame {
            position: relative;
            width: 390px;
            height: 750px;
            max-height: calc(100vh - 130px);
            background: #111827;
            border-radius: 50px;
            box-shadow: 0 0 0 12px #1f2937,
                        0 0 0 15px #374151,
                        0 30px 60px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Smartphone Dynamic Island Notch */
        .phone-notch {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 28px;
            background-color: #000000;
            border-radius: 20px;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
        }

        .camera-lens {
            width: 10px;
            height: 10px;
            background-color: #1a1a1a;
            border-radius: 50%;
            border: 1px solid #333;
        }

        .speaker-grille {
            width: 50px;
            height: 4px;
            background-color: #222;
            border-radius: 2px;
        }

        /* Iframe Display */
        .phone-screen {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #ffffff;
            border-radius: 40px;
            padding-top: 10px;
        }

        /* Device Landscape Mode */
        .device-wrapper.landscape .smartphone-frame {
            width: 800px;
            height: 390px;
        }

        .device-wrapper.landscape .phone-notch {
            top: 50%;
            left: 12px;
            transform: translateY(-50%);
            width: 28px;
            height: 120px;
            flex-direction: column;
        }

        .device-wrapper.landscape .speaker-grille {
            width: 4px;
            height: 50px;
        }

        /* Responsive Layout Adjustments */
        @media (max-width: 480px) {
            .smartphone-frame {
                width: 340px;
                height: 700px;
                border-radius: 40px;
            }
        }
    </style>
</head>
<body>

    <!-- Toolbar Controls -->
    <div class="toolbar">
        <div class="toolbar-title">
            <i class="fa-solid fa-mobile-screen-button"></i>
            <span>محاكي الجوال (Mobile Viewport)</span>
            <div class="badge-live">
                <div class="pulse-dot"></div>
                <span>Port 3006</span>
            </div>
        </div>

        <div class="controls-group">
            <button class="btn-ctrl active" id="btnPortrait">
                <i class="fa-solid fa-mobile-screen"></i> عمودي (Portrait)
            </button>
            <button class="btn-ctrl" id="btnLandscape">
                <i class="fa-solid fa-rotate-left"></i> أفقي (Landscape)
            </button>
            <button class="btn-ctrl" id="btnIphone">
                <i class="fa-solid fa-mobile"></i> 390px
            </button>
            <button class="btn-ctrl" id="btnProMax">
                <i class="fa-solid fa-mobile"></i> 430px
            </button>
            <a href="http://localhost:3005" target="_blank" class="btn-ctrl" style="background: rgba(45, 212, 191, 0.2); color: #2dd4bf;">
                <i class="fa-solid fa-arrow-up-right-from-square"></i> فتح موقع الويب العادي
            </a>
        </div>
    </div>

    <!-- Phone Device Frame -->
    <div class="device-wrapper" id="deviceWrapper">
        <div class="smartphone-frame" id="phoneFrame">
            <!-- Dynamic Island / Notch -->
            <div class="phone-notch">
                <div class="speaker-grille"></div>
                <div class="camera-lens"></div>
            </div>

            <!-- Iframe Loading local site -->
            <iframe src="http://localhost:3005" class="phone-screen" id="phoneIframe" title="معاينة موقع خدمات الصرف الصحي على الجوال"></iframe>
        </div>
    </div>

    <!-- Interactive Script -->
    <script>
        const deviceWrapper = document.getElementById('deviceWrapper');
        const phoneFrame = document.getElementById('phoneFrame');
        const btnPortrait = document.getElementById('btnPortrait');
        const btnLandscape = document.getElementById('btnLandscape');
        const btnIphone = document.getElementById('btnIphone');
        const btnProMax = document.getElementById('btnProMax');

        btnPortrait.addEventListener('click', () => {
            deviceWrapper.classList.remove('landscape');
            btnPortrait.classList.add('active');
            btnLandscape.classList.remove('active');
        });

        btnLandscape.addEventListener('click', () => {
            deviceWrapper.classList.add('landscape');
            btnLandscape.classList.add('active');
            btnPortrait.classList.remove('active');
        });

        btnIphone.addEventListener('click', () => {
            if (!deviceWrapper.classList.contains('landscape')) {
                phoneFrame.style.width = '390px';
            }
            btnIphone.classList.add('active');
            btnProMax.classList.remove('active');
        });

        btnProMax.addEventListener('click', () => {
            if (!deviceWrapper.classList.contains('landscape')) {
                phoneFrame.style.width = '430px';
            }
            btnProMax.classList.add('active');
            btnIphone.classList.remove('active');
        });
    </script>
</body>
</html>
